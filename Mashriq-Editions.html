<script type="text/babel">
/* maps + app — Mashriq Editions */
const { useId, useState, useEffect, useRef } = React;

const INK="#1F1A14", INDIGO="#3A4A66", RUST="#9C4A2E", GREY="#8A7F6E", PARCH="#F4EEE4";

function HatchDefs({ idHatch, idStipple, color=INDIGO, density=6 }) {
  return (
    <defs>
      <pattern id={idHatch} width={density} height={density} patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <line x1="0" y1="0" x2="0" y2={density} stroke={color} strokeWidth="0.45" opacity="0.55"/>
      </pattern>
      <pattern id={idStipple} width="5" height="5" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.45" fill={color} opacity="0.55"/>
      </pattern>
    </defs>
  );
}

function PlateFrame({ w, h, pad=14, ticks=true }) {
  const inner = pad + 6;
  return (
    <g fill="none" stroke={INK} opacity="0.78">
      <rect x={pad} y={pad} width={w-2*pad} height={h-2*pad} strokeWidth="0.7"/>
      <rect x={inner} y={inner} width={w-2*inner} height={h-2*inner} strokeWidth="0.35"/>
      {ticks && (
        <g strokeWidth="0.4" opacity="0.8">
          {Array.from({length: Math.floor((w-2*inner)/24)-1}).map((_,i)=>{
            const x=inner+24*(i+1);
            return <g key={"tx"+i}><line x1={x} y1={inner} x2={x} y2={inner+3}/><line x1={x} y1={h-inner} x2={x} y2={h-inner-3}/></g>;
          })}
          {Array.from({length: Math.floor((h-2*inner)/24)-1}).map((_,i)=>{
            const y=inner+24*(i+1);
            return <g key={"ty"+i}><line x1={inner} y1={y} x2={inner+3} y2={y}/><line x1={w-inner} y1={y} x2={w-inner-3} y2={y}/></g>;
          })}
        </g>
      )}
    </g>
  );
}

function CompassRose({ cx, cy, r=14, color=INK }) {
  return (
    <g stroke={color} fill="none" strokeWidth="0.6" opacity="0.85">
      <circle cx={cx} cy={cy} r={r}/>
      <circle cx={cx} cy={cy} r={r*0.55} strokeWidth="0.35"/>
      <line x1={cx} y1={cy-r-4} x2={cx} y2={cy+r+4}/>
      <line x1={cx-r-4} y1={cy} x2={cx+r+4} y2={cy}/>
      <polygon points={`${cx},${cy-r} ${cx-3},${cy} ${cx+3},${cy}`} fill={color} opacity="0.9" stroke="none"/>
      <text x={cx} y={cy-r-7} textAnchor="middle" fontSize="6.5" fill={color} stroke="none" fontStyle="italic">N</text>
    </g>
  );
}

function Cartouche({ x, y, w, h, title, subtitle, color=INK }) {
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} fill={PARCH} stroke={color} strokeWidth="0.6" opacity="0.95"/>
      <rect x={x+3} y={y+3} width={w-6} height={h-6} fill="none" stroke={color} strokeWidth="0.25"/>
      <text x={x+w/2} y={y+h/2-2} textAnchor="middle" fontSize="11" fill={color} fontFamily="ui-serif, Georgia, serif" fontStyle="italic">{title}</text>
      {subtitle && <text x={x+w/2} y={y+h/2+11} textAnchor="middle" fontSize="7.5" fill={color} fontFamily="ui-serif, Georgia, serif" opacity="0.8">{subtitle}</text>}
    </g>
  );
}

function Label({ x, y, children, size=8.5, color=INK, italic=true, anchor="middle", opacity=0.85, rotate=0 }) {
  return (
    <text x={x} y={y} textAnchor={anchor} fontSize={size} fill={color}
      fontFamily="ui-serif, Georgia, serif" fontStyle={italic?"italic":"normal"}
      opacity={opacity} transform={rotate?`rotate(${rotate} ${x} ${y})`:undefined}>{children}</text>
  );
}

function HeroBeirut1900({ className="" }) {
  const hatch=useId();
  const coast="M 0,295 C 80,300 140,260 220,275 S 360,300 460,270 S 600,250 700,260 L 760,260 L 760,300 L 830,300 L 830,255 L 900,250 C 1010,245 1110,260 1200,255";
  const seaShape=coast+" L 1200,0 L 0,0 Z";
  return (
    <svg className={className} viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plan of Beirut, 1900">
      <HatchDefs idHatch={hatch} idStipple={useId()} color={INDIGO} density={8}/>
      <rect width="1200" height="640" fill={PARCH}/>
      <path d={seaShape} fill={`url(#${hatch})`}/>

        <path d="M 0,250 C 200,260 420,235 700,225 S 1100,215 1200,225"/>

      </g>

        <path d="M 60,360 L 320,355 L 360,420 L 220,490 L 90,440 Z" fill={GREY} opacity="0.16"/>
        <path d="M 360,420 L 560,400 L 600,500 L 420,530 L 360,470 Z" fill={GREY} opacity="0.10"/>
        <path d="M 600,500 L 820,470 L 880,560 L 660,600 Z" fill={GREY} opacity="0.16"/>
      </g>
      <g stroke={INK} strokeWidth="0.7" opacity="0.78" fill="none">
        <path d="M 30,330 C 200,335 380,310 560,305 S 880,310 1180,300" strokeWidth="1.1"/>
        <path d="M 200,330 L 280,540"/><path d="M 280,322 L 320,560"/><path d="M 360,315 L 380,580"/>
        <path d="M 440,310 L 480,600"/><path d="M 520,308 L 560,610"/><path d="M 620,308 L 640,620"/>
        <path d="M 700,305 L 720,620"/><path d="M 780,310 L 820,620"/><path d="M 860,300 L 900,620"/>

function App() {
  const [lang,setLang]=useState("en");
  const [cart,setCart]=useState([]);
  const [justAdded,setJustAdded]=useState(false);
  const [openCard,setOpenCard]=useState(null);
  const addTimer=useRef(null);
  useEffect(()=>{
    document.documentElement.lang=lang;
    document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  },[lang]);
  useEffect(()=>{
    document.body.style.overflow=openCard?"hidden":"";
    return ()=>{document.body.style.overflow="";};
  },[openCard]);
  function add(card){
    setCart(c=>[...c,card]);
    setJustAdded(true);
    if (addTimer.current) clearTimeout(addTimer.current);
    addTimer.current=setTimeout(()=>setJustAdded(false),1800);
  }
  return (
    <div className="min-h-screen flex flex-col" dir={lang==="ar"?"rtl":"ltr"}>
      <Header lang={lang} setLang={setLang} cartCount={cart.length} justAdded={justAdded}/>
      <Hero lang={lang}/>
      <Editorial lang={lang}/>
      <Collections lang={lang}/>
      <Featured lang={lang}/>
      <Archive lang={lang} onAdd={add} onOpen={setOpenCard}/>
      <Provenance lang={lang}/>
      <Footer lang={lang}/>
      <DetailPanel card={openCard} lang={lang} onClose={()=>setOpenCard(null)} onAdd={(c)=>{add(c);setOpenCard(null);}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
